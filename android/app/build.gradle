apply plugin: 'com.android.application'

// Signing material never lives in the repo. CI writes keystore.properties
// (and the .jks it points at) from repository secrets before building; a
// laptop build without it still produces a working debug APK, which is what
// you want when you are only trying a change out.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Read into plain variables first. Inside the DSL, `versionCode (expr).foo()`
// is parsed by Groovy as `versionCode(expr).foo()` - a call whose result is
// then dereferenced - so AGP ends up being handed something that is not the
// version code at all, and fails during configuration with "Value is null".
def buildVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1") as Integer
def buildVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
def hasSigningKey = keystorePropertiesFile.exists()

android {
    namespace = "in.mlaimanager.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.mlaimanager.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Set by the release workflow from the run number and the tag, so two
        // builds are never the same version to a phone.
        versionCode buildVersionCode
        versionName buildVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Left off deliberately: Capacitor reaches plugin classes by
            // name from JavaScript, and a stripped build fails at the first
            // bridge call rather than at compile time - the worst moment to
            // find out. The app is a thin shell; there is nothing here worth
            // the risk of shrinking.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Assigning null here is rejected by AGP; an unset signingConfig
            // is how a build without the key says so, and the workflow only
            // asks for a release build when the key is present.
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Owns the retrying of a forwarded message: it survives the app being
    // killed, the phone rebooting, and a night with no signal.
    implementation "androidx.work:work-runtime:2.10.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
